spring.application.name=tlias-web-manager

spring.datasource.type=com.alibaba.druid.pool.DruidDataSource
spring.datasource.url=jdbc:mysql://localhost:3306/tables?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.configuration.log-impl=org.apache.ibatis.logging.stdout.StdOutImpl
mybatis.mapper-locations=classpath:com/wb/mapper/*.xml
mybatis.type-aliases-package=com.wb.entity
mybatis.configuration.map-underscore-to-camel-case=true

# Actuator - only expose health endpoint
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=when-authorized

# Pagination
pagehelper.helper-dialect=mysql
pagehelper.reasonable=true
pagehelper.support-methods-arguments=true
